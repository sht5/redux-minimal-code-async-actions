<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DECK_TITLE</title>
<style>
  :root{
    --bg: #0c0d0a;
    --panel: #131409;
    --chrome: #1a1c12;
    --ink: #e2e2d2;
    --ink-dim: #9a9b86;
    --ink-faint: #63644f;
    --accent: #ffb000;
    --accent-dim: #7a5600;
    --ok: #8fd14f;
    --err: #ff6b5e;
    --blue: #7ec8e3;
    --line: rgba(226,226,210,0.14);
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;

    --fs-h1: clamp(46px, 6.4vw, 88px);
    --fs-h2: clamp(32px, 4.2vw, 54px);
    --fs-body: clamp(19px, 1.5vw, 23px);
    --fs-code: clamp(17px, 1.25vw, 20px);
    --fs-prompt: 16px;
    --fs-status: 13.5px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--mono); overflow:hidden;
  }
  .window{
    position:fixed; inset:0;
    background:var(--panel);
    display:flex; flex-direction:column;
  }
  .titlebar{
    background:var(--chrome); height:48px; flex:none;
    display:flex; align-items:center; padding:0 20px; gap:10px;
    border-bottom:1px solid var(--line);
  }
  .dot3{ width:12px; height:12px; border-radius:50%; }
  .dot3.r{ background:#ff5f56; } .dot3.y{ background:#ffbd2e; } .dot3.g{ background:#27c93f; }
  .titlebar .path{ margin:0 auto; transform:translateX(-18px); font-size:14px; color:var(--ink-faint); }

  .screen{ position:relative; flex:1; min-height:0; }
  .slide{
    position:absolute; inset:0; display:none; flex-direction:column;
    padding:5vh 7vw 4vh;
    overflow:auto;
  }
  .slide.active{ display:flex; }

  .prompt{
    font-size:var(--fs-prompt); color:var(--ink-faint); margin:0 0 5vh;
    display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .prompt .sym{ color:var(--ok); }
  .prompt .path{ color:var(--blue); }
  .prompt .cmd{ color:var(--ink); }

  h1{
    font-size:var(--fs-h1); line-height:1.05; margin:0 0 22px; font-weight:600;
    color:var(--ink); text-wrap:balance; max-width:22ch;
  }
  h1 .amp{ color:var(--accent); }
  h2{ font-size:var(--fs-h2); margin:0 0 5vh; color:var(--accent); font-weight:600; text-wrap:balance; }
  h2::before{ content:"# "; color:var(--ink-faint); }
  .lede{ font-size:var(--fs-body); line-height:1.65; color:var(--ink-dim); max-width:34ch; margin:0 0 14px; }
  .content{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:32px; min-height:0; }

  .log{ list-style:none; margin:0; padding:0; display:grid; gap:16px; max-width:820px; }
  .log li{ font-size:var(--fs-body); line-height:1.6; color:var(--ink); display:flex; gap:16px; }
  .log li .tag{ flex:none; color:var(--accent); }
  .log li.ok .tag{ color:var(--ok); }
  .log li.err .tag{ color:var(--err); }

  .callout{
    display:inline-block; font-size:calc(var(--fs-body) - 3px); color:var(--accent);
    border:1px solid var(--accent-dim); background:rgba(255,176,0,0.06);
    padding:14px 20px; max-width:760px;
  }
  .callout::before{ content:"// "; color:var(--accent-dim); }

  pre{
    font-size:var(--fs-code); line-height:1.7; background:#0a0b07;
    border:1px solid var(--line); padding:24px 28px; margin:0; overflow:auto;
    color:var(--ink);
  }
  .kw{ color:var(--blue); } .fn{ color:var(--accent); } .str{ color:var(--ok); } .cm{ color:var(--ink-faint); }

  .steps{ display:grid; gap:0; max-width:780px; }
  .steps .s{ display:flex; gap:18px; padding:16px 0; border-bottom:1px solid var(--line); }
  .steps .s:last-child{ border-bottom:none; }
  .steps .idx{ color:var(--ink-faint); font-size:var(--fs-body); }
  .steps .arrow{ color:var(--accent); font-size:var(--fs-body); }
  .steps p{ margin:0; font-size:var(--fs-body); color:var(--ink); }
  .steps code{ color:var(--accent); }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:28px; max-width:1100px; }
  .col-head{ display:flex; align-items:baseline; justify-content:space-between; margin:0 0 10px; }
  .col-head .name{ font-size:13px; color:var(--ink-faint); }
  .badge{ font-size:12px; color:var(--ink-faint); border:1px solid var(--line); padding:3px 8px; }
  .badge.warn{ color:var(--err); border-color:var(--err); }
  .badge.good{ color:var(--ok); border-color:var(--ok); }

  .statusbar{
    flex:none; height:44px; background:var(--chrome); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 22px;
    font-size:var(--fs-status); color:var(--ink-faint);
  }
  .statusbar .left{ display:flex; align-items:center; gap:10px; }
  .statusbar .ok-pill{ color:var(--ok); }
  .statusbar .type-name{ color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.08em; }
  .statusbar .right{ display:flex; align-items:center; gap:16px; }
  .dots{ display:flex; gap:7px; }
  .dot-nav{ width:6px; height:6px; background:var(--ink-faint); opacity:0.5; cursor:pointer; }
  .dot-nav.active{ background:var(--accent); opacity:1; }
  .arrow-btn{
    font-family:var(--mono); background:none; border:1px solid var(--line); color:var(--ink-dim);
    width:28px; height:28px; cursor:pointer; font-size:13px; border-radius:3px;
  }
  .arrow-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .counter{ font-variant-numeric:tabular-nums; min-width:52px; }

  .cursor{ display:inline-block; width:0.5em; height:0.85em; background:var(--accent); vertical-align:-0.12em; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .cursor{ animation:none; } }

  /* ---- section / statement ---- */
  .divider{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; }
  .divider .cmdline{ font-size:clamp(30px,4vw,48px); color:var(--accent); }
  .divider .cmdline .sym{ color:var(--ok); }
  .divider .sub{ font-size:var(--fs-body); color:var(--ink-dim); max-width:40ch; }

  .statement{ flex:1; display:flex; align-items:center; }
  .statement p{
    font-size:clamp(30px,3.6vw,46px); line-height:1.35; color:var(--ink);
    max-width:20ch; margin:0; text-wrap:balance;
  }
  .statement .var{ color:var(--accent); }

  /* ---- metric ---- */
  .metric{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; }
  .metric .num{ font-size:clamp(64px,10vw,160px); color:var(--accent); line-height:1; font-weight:600; }
  .metric .label{ font-size:var(--fs-body); color:var(--ink-dim); max-width:44ch; }
  .metric .detail{ font-size:14px; color:var(--ink-faint); max-width:60ch; margin-top:6px; }

  /* ---- flowchart: node graph ---- */
  .diagram-c-wrap{ position:relative; width:100%; max-width:980px; aspect-ratio:1000/600; margin:0 auto; }
  .diagram-c-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .node-c{
    position:absolute; transform:translate(-50%,-50%);
    width:190px; border:1px solid var(--line); background:#0a0b07; color:var(--ink);
    padding:10px 14px; font-size:calc(var(--fs-code) - 3px); text-align:center; line-height:1.4;
  }
  .node-c.decision{ border-color:var(--accent); color:var(--accent); }
  .node-c.ok{ border-color:var(--ok); color:var(--ok); width:170px; }
  .node-c.err{ border-color:var(--err); color:var(--err); width:170px; }
  .node-c.dim{ color:var(--ink-dim); }

  .title-slide .content{ justify-content:flex-end; }
  .meta-line{ font-size:13.5px; color:var(--ink-faint); }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <span class="dot3 r"></span><span class="dot3 y"></span><span class="dot3 g"></span>
    <span class="path" id="titlepath">~/deck</span>
  </div>
  <div class="screen">

    <!-- SLIDES_GO_HERE -->
    <!-- Insert one <section class="slide" data-type="..."> per planned slide, in order.        -->
    <!-- Mark the first one class="slide active". Use the templates in                           -->
    <!-- references/slide-types.md — copy the structure, fill in the approved content.            -->

  </div>
  <div class="statusbar">
    <div class="left">
      <span class="ok-pill">●</span>
      <span>connected</span>
      <span>·</span>
      <span class="type-name" id="typename"></span>
    </div>
    <div class="right">
      <div class="dots" id="dots"></div>
      <button class="arrow-btn" id="prev" aria-label="Previous">&lt;</button>
      <span class="counter" id="counter"></span>
      <button class="arrow-btn" id="next" aria-label="Next">&gt;</button>
    </div>
  </div>
</div>
<script>
(function(){
  var slides = document.querySelectorAll('.slide');
  var total = slides.length;
  var idx = 0;
  var dotsWrap = document.getElementById('dots');
  var counter = document.getElementById('counter');
  var typename = document.getElementById('typename');
  var titlepath = document.getElementById('titlepath');
  for (var i=0;i<total;i++){
    var d = document.createElement('div');
    d.className = 'dot-nav';
    d.addEventListener('click', (function(n){ return function(){ show(n); }; })(i));
    dotsWrap.appendChild(d);
  }
  var dots = document.querySelectorAll('.dot-nav');
  function show(i){
    idx = Math.max(0, Math.min(total-1, i));
    slides.forEach(function(s,n){ s.classList.toggle('active', n===idx); });
    dots.forEach(function(d,n){ d.classList.toggle('active', n===idx); });
    counter.textContent = String(idx+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
    var current = slides[idx];
    var type = current.getAttribute('data-type');
    typename.textContent = type;
    titlepath.textContent = '~/deck — ' + type + '.slide';
  }
  document.addEventListener('keydown', function(e){
    if (['ArrowRight','ArrowDown','PageDown',' '].indexOf(e.key) !== -1){ e.preventDefault(); show(idx+1); }
    if (['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key) !== -1){ e.preventDefault(); show(idx-1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(total-1);
  });
  document.getElementById('next').addEventListener('click', function(){ show(idx+1); });
  document.getElementById('prev').addEventListener('click', function(){ show(idx-1); });
  show(0);
})();
</script>
</body>
</html>
